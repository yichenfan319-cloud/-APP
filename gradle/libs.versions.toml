[versions]
agp = "9.2.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.12.0"
constraintlayout = "2.1.4"
navigation = "2.7.7"
recyclerview = "1.3.2"
okhttp = "4.12.0"
gson = "2.10.1"
jsoup = "1.17.2"

# --- 底部导航（Compose 版液态玻璃） ---
kotlin = "2.4.21"
composeUi = "1.12.0"
backdrop = "2.0.1"

[libraries]
# --- 测试 ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# --- UI ---
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
# 开源许可页的列表用它渲染（不再把十几条写死在 XML 里）
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }

# --- 导航（纯 Java 工程，用不带 -ktx 的版本，-ktx 是 Kotlin 扩展包） ---
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigation" }

# --- 网络与解析 ---
# okhttp：公告 / 版本检查，以及课表的直连请求
# gson  ：接口返回的 JSON
# jsoup ：把教务系统返回的课表片段当 DOM 解析（纯 Java，可在 JVM 单测里跑）
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# --- 液态玻璃（iOS 26 风格）---
# backdrop 是 Compose 库：用 rememberLayerBackdrop 记录内容层，再用
# Modifier.drawBackdrop + lens() 算出折射位移。相比之前的 QWEA0 版本，
# 它支持同一屏多个玻璃实例（QWEA0 那个进程级共享取景，两个实例必崩）。
backdrop = { group = "io.github.kyant0", name = "backdrop-android", version.ref = "backdrop" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeUi" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "composeUi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
